name: Python CI

on:
  pull-request:
    branches: [master]
jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: |
          pip install -r requirements.txt
          pip install ruff pytest httpx
      - name: Lint
        run: ruff check
      - name: Run Tests
        run: pytest