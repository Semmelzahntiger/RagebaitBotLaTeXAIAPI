name: Deploy

on:
  push:
    branches: [master]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key : ${{ secrets.VM_KEY }}
          port : ${{ secrets.VM_PORT }}
          script: |
            cd ~/images/RagebaitBotLaTeXAIAPI
            git pull origin
            docker compose up -d --build
